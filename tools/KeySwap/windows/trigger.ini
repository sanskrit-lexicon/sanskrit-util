# KeySwap 2.8 — cycle trigger preset (copy to trigger.ini beside KeySwap.ahk)
#
# On non-US layouts (or when Word steals =), pick another cycle key.
# Env KEYSWAP_TRIGGER overrides this file when set.
#
# Presets: equals | bracket | slash | backtick
#   equals    =   (default US)     literal: Shift+=
#   bracket   ]                    literal: Shift+]
#   slash     /                    literal: Shift+/
#   backtick  `                    literal: Shift+`

preset=equals
