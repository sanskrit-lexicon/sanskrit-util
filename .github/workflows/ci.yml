name: CI

# Runs the cross-language test suite so the README/CHANGELOG claim "JS == Python, asserted on
# every commit" is actually enforced: Python unit + golden-vector tests, the JS port asserting the
# same vectors, a freshness check that vectors.json is regenerable, and the adversarial cross-check.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install package (editable) + pytest
        run: |
          pip install -e ./py
          pip install pytest

      - name: Python tests (pitfall units + golden vectors)
        run: python -m pytest py/tests -q

      - name: vectors.json is current (regenerate, expect no diff)
        run: |
          python tools/gen_vectors.py
          git diff --exit-code -- vectors/vectors.json

      - name: Browser global build is current (regenerate, expect no diff)
        run: node js/build-global.mjs --check

      - name: JS tests (vectors + units + global build; all == Python)
        working-directory: js
        run: npm test

      - name: Cross-language check (Python == JS on exotic/BOM/whitespace inputs)
        run: python tools/crosscheck.py

  csl-pyutil:
    # Separate job: csl_pyutil is a sibling package, not the Sanskrit
    # string-helpers package the job above proves — no JS side, no golden
    # vectors, unrelated scope.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install csl_pyutil (editable) + pytest
        run: pip install -e ./csl_pyutil pytest

      - name: csl_pyutil tests
        # Must run with csl_pyutil/ as CWD, not repo root: the outer folder and the
        # inner package share the name "csl_pyutil", so invoking pytest from repo
        # root lets `-m`'s CWD-on-sys.path insertion shadow the installed package
        # with an empty namespace package (repo root's own csl_pyutil/ subdir has
        # no __init__.py). Same working-directory pattern the JS job uses below.
        working-directory: csl_pyutil
        run: python -m pytest tests -q
